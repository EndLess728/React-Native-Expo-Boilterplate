# Publishes a GitHub Release for every push to main that contains releasable
# Conventional Commits. The version comes from the commits since the last
# `v*` tag (feat → minor, fix/perf/… → patch, `!` / BREAKING CHANGE → major)
# and the release notes are generated by git-cliff (config: cliff.toml).
# Pushes with nothing releasable (e.g. only chore/docs/ci) are skipped.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

# One release at a time, in push order — never cancel a half-made release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF: git-cliff@2.14.2

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the version bump and changelog

      - name: Work out the next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          next=$(npx -y "$GIT_CLIFF" --bumped-version 2>/dev/null)
          echo "last=${last:-none} next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          # git-cliff returns the last tag again when nothing since it bumps the version.
          if [ -n "$next" ] && [ "$next" != "$last" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No releasable commits since ${last:-the start} — skipping the release."
          fi

      - name: Generate release notes
        if: steps.version.outputs.release == 'true'
        run: |
          npx -y "$GIT_CLIFF" --unreleased --tag "${{ steps.version.outputs.next }}" \
            --strip header --output RELEASE_NOTES.md
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.next }}" \
            --notes-file RELEASE_NOTES.md
