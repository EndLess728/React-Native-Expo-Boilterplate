# git-cliff — builds release notes from Conventional Commits.
# Used by .github/workflows/release.yml. Docs: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Tests" },
  { message = "^build|^chore\\(deps", group = "<!-- 6 -->📦 Dependencies & build" },
  { message = "^ci", group = "<!-- 7 -->⚙️ CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^style|^revert", group = "<!-- 8 -->🧹 Chores" },
]

[remote.github]
owner = "EndLess728"
repo = "React-Native-Expo-Boilterplate"

[bump]
# Before 1.0.0, breaking changes bump the minor and features bump the patch.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"
